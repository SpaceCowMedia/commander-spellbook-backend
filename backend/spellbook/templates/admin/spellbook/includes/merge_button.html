<li>
    <form method="post" action="{% url merge_url original.id %}" class="inline" novalidate>
        {% csrf_token %}
        <button type="submit" class="default">
            <span class="button__text">Merge into</span>
        </button>
        <input type="text" name="into" placeholder="{{ merge_placeholder }}" style="width: {{ merge_placeholder|length|add:1 }}ch;" required>
    </form>
</li>
