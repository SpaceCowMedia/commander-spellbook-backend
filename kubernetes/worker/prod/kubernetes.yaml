apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: spellbook-prod
  name: spellbook-worker
  labels:
    app: spellbook-worker
spec:
  replicas: 1
  strategy:
    # A surging replacement would have to fit a second 8Gi worker on the node
    type: Recreate
  selector:
    matchLabels:
      app: spellbook-worker
  template:
    metadata:
      labels:
        app: spellbook-worker
    spec:
      serviceAccountName: worker-service-account
      # A task the worker picked up runs to completion before it exits, so a graceful
      # shutdown has to outlast the longest one: cut short, the task is left behind
      # with no worker and no way to ever leave the RUNNING state.
      terminationGracePeriodSeconds: 1800
      containers:
        - name: spellbook-worker-app
          image: 083767677168.dkr.ecr.us-east-2.amazonaws.com/spellbook-worker-prod-ecr
          resources:
            # The task pool sizes itself on the cpu limit, so the limit is what caps the
            # fan-out of a task, and the request has to match it for those forked
            # processes to get the cores they were spawned for on a contended node.
            requests:
              cpu: 4
              memory: 8Gi
            limits:
              cpu: 4
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: django-secret
            - name: SQL_ENGINE
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: db-engine
            - name: SQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: db-name
            - name: SQL_USER
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: db-user
            - name: SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: db-password
            - name: SQL_HOST
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: db-host
            - name: SQL_PORT
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: db-port
            - name: AWS_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: aws-s3-bucket
            - name: THIS_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DISCORD_CLIENTID
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: discord-client-id
            - name: DISCORD_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: discord-client-secret
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: discord-webhook-url
            - name: MOXFIELD_USER_AGENT
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: moxfield-user-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-service-account
  namespace: spellbook-prod
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::083767677168:role/spellbook-application-role
