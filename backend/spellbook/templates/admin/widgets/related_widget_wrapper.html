{% extends "admin/widgets/related_widget_wrapper.html" %}
{% load static %}

{% block links %}
    {{ block.super }}
    {% if can_view_related %}
        <img src="{% static 'admin/images/icon-copy.svg' %}" alt="" width="24" height="24"
            onclick="const option = django.jQuery(this).prevAll('select')[0]?.selectedOptions[0]; if (option?.value) { setClipboard(option.textContent); this.style.opacity = 0.5; setTimeout(() => this.style.opacity = 1, 200); }"
            style="cursor: pointer;" title="Copy to clipboard"/>
    {% endif %}
{% endblock %}
