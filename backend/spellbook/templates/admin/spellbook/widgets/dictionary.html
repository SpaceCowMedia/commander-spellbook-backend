<div class="dictionary-field">
    <textarea name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %} hidden>{% if widget.value %}{{ widget.value }}{% endif %}</textarea>
    <button type="button" class="dictionary-summary{% if widget.keys is None %} dictionary-invalid{% elif not widget.keys %} dictionary-empty{% endif %}" title="Edit the dictionary"><span class="dictionary-keys">{% if widget.keys is None %}Invalid, edit to fix{% elif widget.keys %}{% for key, blank in widget.keys %}{% if not forloop.first %}, {% endif %}{% if blank %}<s>{{ key }}</s>{% else %}{{ key }}{% endif %}{% endfor %}{% else %}Add keys{% endif %}</span>{% if widget.keys %}<span class="dictionary-count" title="{{ widget.keys|length }} key{{ widget.keys|length|pluralize }}">{{ widget.keys|length }}</span>{% endif %}</button>
</div>
